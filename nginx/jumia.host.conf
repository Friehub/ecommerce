upstream web_pool {
    server 127.0.0.1:3000;
}

upstream api_pool {
    server 127.0.0.1:4000;
}

server {
    listen 80;
    server_name staging.friehub.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.friehub.cloud;

    # SSL - Absolute paths for the VPS runner
    ssl_certificate     /opt/runner-work/jumia-staging/nginx/certs/fullchain.pem;
    ssl_certificate_key /opt/runner-work/jumia-staging/nginx/certs/privkey.pem;

    # Performance
    client_max_body_size 50M;
    proxy_buffer_size        32k;
    proxy_buffers            8 32k;
    proxy_busy_buffers_size  64k;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /_next/static/ {
        proxy_pass http://web_pool;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /api/auth/ {
        proxy_pass http://web_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /trpc/ {
        proxy_pass http://api_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
