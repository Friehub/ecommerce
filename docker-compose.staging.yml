
networks:
  edge-net:
    driver: bridge
  app-net:
    driver: bridge
  db-net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  search_index:
  prometheus_data:
  grafana_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env.staging
    environment:
      POSTGRES_DB: ecom
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    networks: [db-net]
    command: ["postgres", "-c", "shared_buffers=2GB", "-c", "effective_cache_size=6GB", "-c", "work_mem=64MB", "-c", "max_connections=100", "-c", "checkpoint_completion_target=0.9"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    env_file:
      - .env.staging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--save", "900", "1"]
    volumes:
      - redis_data:/data
    networks: [app-net, db-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.31.0-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [edge-net]
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --no-verbose --tries=1 --spider http://localhost/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    image: jumia-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    restart: always
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: "postgresql://ecom:${DB_PASSWORD}@postgres:5432/ecom?sslmode=disable"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET}
    networks: [edge-net, app-net, db-net]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    image: jumia-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile.prod
    restart: always
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: "postgresql://ecom:${DB_PASSWORD}@postgres:5432/ecom?sslmode=disable"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ALLOWED_ORIGINS: "https://staging.friehub.cloud"
      PAYSTACK_SECRET: ${PAYSTACK_SECRET_KEY}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      PORT: 4000
      HOST: 0.0.0.0
      SEARCH_SERVICE_URL: http://search:3001
      INVENTORY_SERVICE_URL: http://inventory:3002
      FRAUD_SERVICE_URL: http://fraud:3004
      RECOMMENDATIONS_SERVICE_URL: http://recommendations:3005
      IMAGE_PROCESSOR_SERVICE_URL: http://image-processor:3006
    networks: [edge-net, app-net, db-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

