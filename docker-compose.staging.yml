  workers:
    image: jumia-workers:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: packages/api/Dockerfile.workers
    restart: always
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: "postgresql://ecom:${DB_PASSWORD}@postgres:5432/ecom?sslmode=disable"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SEARCH_SERVICE_URL: http://search:3001
      INVENTORY_SERVICE_URL: http://inventory:3002
      FRAUD_SERVICE_URL: http://fraud:3004
      RECOMMENDATIONS_SERVICE_URL: http://recommendations:3005
      IMAGE_PROCESSOR_SERVICE_URL: http://image-processor:3006
    networks: [app-net, db-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep node || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  event-consumer:
    image: jumia-event-consumer:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/event-consumer/Dockerfile
    restart: always
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: "postgresql://ecom:${DB_PASSWORD}@postgres:5432/ecom?sslmode=disable"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks: [app-net, db-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep event-consumer || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.45.0
    restart: always
    env_file:
      - .env.staging
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks: [app-net]
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:10.0.3
    restart: always
    env_file:
      - .env.staging
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [edge-net, app-net]
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
