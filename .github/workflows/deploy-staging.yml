name: Deploy — Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true  # staging deploys can be superseded

jobs:
  deploy:
    name: Deploy Staging
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ecom/db generate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Write staging .env
        run: |
          mkdir -p /opt/runner-work/jumia-staging
          echo "${{ secrets.STAGING_ENV }}" > /opt/runner-work/jumia-staging/.env.staging
          chmod 600 /opt/runner-work/jumia-staging/.env.staging

      - name: Sync code
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='target' \
            --exclude='apps/web/.next/' \
            --exclude='nginx/certs/' \
            --exclude='.env*' \
            $GITHUB_WORKSPACE/ /opt/runner-work/jumia-staging/

      - name: Start database
        working-directory: /opt/runner-work/jumia-staging
        run: |
          docker compose -f docker-compose.staging.yml --env-file .env.staging up -d postgres
          echo "Waiting for database to be ready..."
          sleep 10

      - name: Migrate staging database
        working-directory: /opt/runner-work/jumia-staging
        run: |
          DATABASE_URL="postgresql://ecom:${{ secrets.DB_PASSWORD }}@localhost:5433/ecom_staging" pnpm --filter @ecom/db prisma migrate deploy

# Removed Prune Docker build cache step to preserve cargo chef cache for faster builds

      - name: Build staging services sequentially
        working-directory: /opt/runner-work/jumia-staging
        env:
          DOCKER_BUILDKIT: 0
          COMPOSE_DOCKER_CLI_BUILD: 0
        run: |
          docker compose -f docker-compose.staging.yml --env-file .env.staging build postgres redis
          docker compose -f docker-compose.staging.yml --env-file .env.staging build search
          docker compose -f docker-compose.staging.yml --env-file .env.staging build inventory
          docker compose -f docker-compose.staging.yml --env-file .env.staging build fraud
          docker compose -f docker-compose.staging.yml --env-file .env.staging build recommendations
          docker compose -f docker-compose.staging.yml --env-file .env.staging build auction
          docker compose -f docker-compose.staging.yml --env-file .env.staging build image-processor
          docker compose -f docker-compose.staging.yml --env-file .env.staging build api
          docker compose -f docker-compose.staging.yml --env-file .env.staging build workers event-consumer
          docker compose -f docker-compose.staging.yml --env-file .env.staging build web
          docker compose -f docker-compose.staging.yml --env-file .env.staging build nginx

      - name: Deploy staging
        working-directory: /opt/runner-work/jumia-staging
        run: |
          docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
