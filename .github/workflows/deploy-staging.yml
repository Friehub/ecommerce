name: Deploy — Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true  # staging deploys can be superseded

jobs:
  deploy:
    name: Deploy Staging
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed for git diff change detection

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ecom/db generate

      - name: Typecheck
        run: pnpm -r typecheck


      - name: Sync code
        run: |
          sudo mkdir -p /opt/runner-work/jumia-staging
          sudo chown -R $USER:$USER /opt/runner-work/jumia-staging
          
          rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='target' \
            --exclude='apps/web/.next/' \
            --exclude='nginx/certs/' \
            --exclude='.env*' \
            $GITHUB_WORKSPACE/ /opt/runner-work/jumia-staging/

      - name: Start database
        working-directory: /opt/runner-work/jumia-staging
        run: |
          docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --force-recreate postgres
          echo "Waiting for database to be ready..."
          sleep 10
          docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T postgres sh -c "psql -U ecom -d ecom -c 'GRANT ALL ON SCHEMA public TO ecom;'"
          docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T postgres sh -c "psql -U ecom -d ecom -c \"SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'ecom' AND pid <> pg_backend_pid();\"" || true
          docker compose -f docker-compose.staging.yml --env-file .env.staging stop api workers event-consumer || true

      - name: Migrate and seed staging database
        run: |
          DB_PASSWORD=$(grep '^DB_PASSWORD=' /opt/runner-work/jumia-staging/.env.staging | cut -d '=' -f2-)
          DATABASE_URL="postgresql://ecom:${DB_PASSWORD}@127.0.0.1:5433/ecom" pnpm --filter @ecom/db npx prisma db push --accept-data-loss --force-reset
          DATABASE_URL="postgresql://ecom:${DB_PASSWORD}@127.0.0.1:5433/ecom" pnpm --filter @ecom/db pnpm run seed

      # ── Detect what changed ────────────────────────────────────────────────
      - name: Detect changed service groups
        id: changes
        run: |
          RUST_CHANGED=false
          TS_CHANGED=false

          if git diff --name-only HEAD~1 HEAD | grep -qE '^services/'; then
            RUST_CHANGED=true
          fi
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(apps/|packages/)'; then
            TS_CHANGED=true
          fi

          echo "rust=$RUST_CHANGED" >> $GITHUB_OUTPUT
          echo "ts=$TS_CHANGED"     >> $GITHUB_OUTPUT
          echo "Rust changed: $RUST_CHANGED | TS changed: $TS_CHANGED"

      # ── Build Rust workspace (ONE cargo-chef pass for all services) ────────
      - name: Build Rust services (workspace)
        if: steps.changes.outputs.rust == 'true'
        working-directory: /opt/runner-work/jumia-staging
        env:
          DOCKER_BUILDKIT: 1
        run: |
          # All Rust services share the same context+dockerfile — BuildKit
          # builds the shared stages (chef/cacher/builder) only ONCE.
          docker compose -f docker-compose.staging.yml --env-file .env.staging build \
            search inventory fraud recommendations auction image-processor

      # ── Build TypeScript services ──────────────────────────────────────────
      - name: Build TypeScript services
        if: steps.changes.outputs.ts == 'true'
        working-directory: /opt/runner-work/jumia-staging
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker compose -f docker-compose.staging.yml --env-file .env.staging build \
            api workers event-consumer web

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Deploy staging
        working-directory: /opt/runner-work/jumia-staging
        run: |
          docker compose -f docker-compose.staging.yml --env-file .env.staging \
            up -d --force-recreate api workers event-consumer web \
            search inventory fraud recommendations auction image-processor

      # ── Bounded cache prune — keeps 15 GB, evicts oldest layers ──────────
      # This replaces the previous "no prune" approach that filled the disk.
      # 15 GB is enough to keep one full Rust workspace cache hit.
      - name: Prune build cache (bounded)
        if: always()
        run: |
          docker builder prune --keep-storage 15GB -f
          docker image prune -f

