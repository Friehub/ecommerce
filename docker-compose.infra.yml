version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env.staging
    environment:
      POSTGRES_DB: ecom
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - infra-net
    command: ["postgres", "-c", "shared_buffers=2GB", "-c", "max_connections=100"]

  redis:
    image: redis:7-alpine
    restart: always
    env_file:
      - .env.staging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - infra-net

networks:
  infra-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
