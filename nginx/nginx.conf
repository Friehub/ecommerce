user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    
    # B04: Map for WebSocket Connection header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'request_id=$request_id';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;   # B01: Lower global limit; override per location

    # Proxy buffering (N03: Prevent 502s from large Next.js/JWT headers)
    proxy_buffer_size        16k;
    proxy_buffers            8 16k;
    proxy_busy_buffers_size  32k;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;       # M06: Avoid compressing tiny files
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml font/truetype font/opentype
        application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting zones (B02: Realistic production thresholds)
    limit_req_zone $binary_remote_addr zone=global:20m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m  rate=2r/s;
    limit_req_status 429; # N02: Correct HTTP status for rate-limited requests

    # Docker internal DNS resolver for dynamic scaling
    resolver 127.0.0.11 valid=10s;

    # Upstream pools
    upstream web_pool {
        least_conn;
        server web:3000  weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 1000; # M07: Periodically recycle connections
    }

    upstream api_pool {
        least_conn;
        server api:4000  weight=1 max_fails=3 fail_timeout=30s;
        keepalive 64;
        keepalive_requests 1000; # M07: Periodically recycle connections
    }

    # Cloudflare Real IP Configuration
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name staging.friehub.cloud;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off; # B05: Disable tickets for forward secrecy

        # M03: OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/certs/fullchain.pem; # N01: Required for stapling verify
        resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Authenticated Origin Pulls (Uncomment when you download cloudflare.crt to certs)
        # ssl_client_certificate /etc/nginx/certs/cloudflare.crt;
        # ssl_verify_client on;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # M01: Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.paystack.com https://checkout.flutterwave.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.friehub.cloud https://images.unsplash.com https://upload.wikimedia.org https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://*.friehub.cloud https://nominatim.openstreetmap.org;" always;
        # M02: Permissions Policy
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header X-Request-ID $request_id always;

        # ── Error interception ────────────────────────────────────
        proxy_intercept_errors on;
        error_page 404 /custom_404;
        error_page 500 502 503 504 /custom_error;

        location = /custom_404 {
            internal;
            default_type application/json;
            return 404 '{"status":404,"message":"Resource Not Found"}';
        }

        location = /custom_error {
            internal;
            default_type application/json;
            return 502 '{"status":502,"message":"Service Temporarily Unavailable"}';
        }

        # ── Static assets ───────────────────────────────────────
        location /_next/static/ {
            proxy_pass         http://web_pool;
            proxy_http_version 1.1;        # N04: Enable keepalive for static assets
            proxy_set_header   Connection "";
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /favicon.ico {
            proxy_pass         http://web_pool;
            proxy_http_version 1.1;        # N04: Enable keepalive for static assets
            proxy_set_header   Connection "";
            expires 30d;
            access_log off;
        }

        # ── Auth routes (NextAuth/Auth.js in Next.js) ─────────────
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            client_max_body_size 1M; # B01: Very strict limit for auth
            proxy_pass         http://web_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── tRPC routes (Fastify API server) ──────────────────────
        location /trpc/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass         http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        # ── File upload routes (Fastify) ───────────────────────────
        location /api/products/bulk-import {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 100M;
            proxy_pass         http://api_pool;
            proxy_http_version 1.1; # B03: Add missing version
            proxy_set_header   Host              $host; # B03: Add missing host
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for; # B03: Add missing forwarded-for
            proxy_set_header   X-Forwarded-Proto $scheme; # B03: Add missing proto
            proxy_connect_timeout 60s; # M04: Specific timeouts
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # ── Socket.io routes (Fastify) ─────────────────────────────
        location /socket.io/ {
            proxy_pass         http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400; # 24 hours for websocket
        }

        # ── All other API routes → Fastify ─────────────────────────
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass         http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s; # Increased from 30s
            proxy_buffer_size        32k; # Increased for large headers
            proxy_buffers            8 32k;
            proxy_busy_buffers_size  64k;
        }

        # ── Block hidden files and folders ─────────────────────────
        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }

        # ── Everything else → Next.js SSR ──────────────────────────
        location / {
            limit_req zone=global burst=50 nodelay;
            proxy_pass         http://web_pool;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade; # B04: Use map variable
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
