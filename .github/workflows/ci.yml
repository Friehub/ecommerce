name: CI

on:
  push:
    branches: [ main, develop, 'fix/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  typescript:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Generate Prisma Client
        run: pnpm db:generate
        
      - name: Typecheck
        run: pnpm typecheck
        
      - name: Lint
        run: pnpm lint
        
      - name: Security Audit
        run: pnpm audit --audit-level high || true # Warn but don't block yet until clean

  rust:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services -> target
          
      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler
        
      - name: Cargo Check
        run: cargo check --manifest-path services/Cargo.toml
        
      - name: Cargo Clippy
        run: cargo clippy --manifest-path services/Cargo.toml -- -D warnings
        
      - name: Install cargo-audit
        run: cargo install cargo-audit
        
      - name: Cargo Audit
        run: cargo audit --manifest-path services/Cargo.toml --deny warnings || true
