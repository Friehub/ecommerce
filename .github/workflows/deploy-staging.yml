name: Deploy — Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Staging
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          clean: false # IMPORTANT: Don't delete .env.staging or other manual files

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ecom/db generate

      - name: Start Infrastructure (Postgres/Redis)
        run: |
          if [ ! -f ".env.staging" ]; then
            echo "ERROR: .env.staging is missing! Please create it in $(pwd)"
            exit 1
          fi
          # Using infra-only compose for staging
          docker compose -f docker-compose.infra.yml --env-file .env.staging up -d --force-recreate
          echo "Waiting for database to be ready..."
          sleep 10
          # Ensure permissions are correct
          docker compose -f docker-compose.infra.yml --env-file .env.staging exec -T postgres sh -c "psql -U ecom -d ecom -c 'GRANT ALL ON SCHEMA public TO ecom;'" || true

      - name: Build Application
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: "production"
        run: |
          find . -name "*.tsbuildinfo" -delete
          pnpm build
          if [ ! -d "apps/api-server/dist" ]; then
            echo "ERROR: apps/api-server/dist was not created!"
            exit 1
          fi
          # Copy Next.js static assets into the standalone directory for correct resource loading
          cp -r apps/web/public apps/web/.next/standalone/apps/web/ || true
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/ || true

      - name: Run Migrations
        run: |
          if [ -f ".env.staging" ]; then
            # Extract DATABASE_URL cleanly, removing any quotes or whitespace
            ENV_DB_URL=$(grep "^DATABASE_URL=" .env.staging | cut -d'=' -f2- | tr -d '"'\')
            if [ ! -z "$ENV_DB_URL" ]; then
              export DATABASE_URL="$ENV_DB_URL"
            fi
          fi
          if [ -z "$DATABASE_URL" ]; then
            export DATABASE_URL="postgresql://ecom:${{ secrets.DB_PASSWORD || 'ecom' }}@127.0.0.1:5433/ecom?sslmode=disable"
          fi
          pnpm --filter @ecom/db npx prisma migrate deploy --schema packages/db/prisma/schema

      - name: Deploy with PM2
        run: |
          if ! command -v pm2 &> /dev/null; then
            npm install -g pm2
          fi
          # Clear stale process configurations to force PM2 to use the new runner cwd path
          pm2 delete all || true
          pm2 start ecosystem.config.cjs --update-env

      - name: Post-Deploy Smoke Test
        run: |
          echo "Verifying staging health..."
          sleep 15
          curl --fail --silent --show-error --max-time 10 http://localhost:4000/health || \
          (echo "Staging smoke test FAILED" && exit 1)
          echo "Staging verified!"
