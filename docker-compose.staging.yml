version: '3.9'

networks:
  edge-net:
    driver: bridge
  app-net:
    driver: bridge
  db-net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  search_index:

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ecom
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    networks: [db-net]
    command: >
      postgres
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c work_mem=64MB
        -c max_connections=100
        -c checkpoint_completion_target=0.9
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 512mb
        --maxmemory-policy noeviction
        --appendonly yes
        --save 900 1
    volumes:
      - redis_data:/data
    networks: [app-net, db-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    networks: [edge-net]
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --no-verbose --tries=1 --spider http://localhost/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    restart: always
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: "postgresql://ecom:${DB_PASSWORD}@postgres:5432/ecom?sslmode=disable"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks: [edge-net, app-net, db-net]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile.prod
    restart: always
    environment:
      DATABASE_URL: "postgresql://ecom:${DB_PASSWORD}@postgres:5432/ecom?sslmode=disable"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PAYSTACK_SECRET: ${PAYSTACK_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      PORT: 4000
      HOST: 0.0.0.0
      SEARCH_SERVICE_URL: http://search:3001
      INVENTORY_SERVICE_URL: http://inventory:3002
      FRAUD_SERVICE_URL: http://fraud:3004
      RECOMMENDATIONS_SERVICE_URL: http://recommendations:3005
      IMAGE_PROCESSOR_SERVICE_URL: http://image-processor:3006
    networks: [edge-net, app-net, db-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  search:
    build:
      context: ./services
      dockerfile: Dockerfile          # workspace build
      target: search-runner
    restart: always
    environment:
      RUST_LOG: info
    volumes:
      - search_index:/data/index
    networks: [app-net]
    deploy:
      resources:
        limits:
          memory: 256M

  inventory:
    build:
      context: ./services
      dockerfile: Dockerfile          # workspace build
      target: inventory-runner
    restart: always
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RUST_LOG: info
    networks: [app-net]
    deploy:
      resources:
        limits:
          memory: 64M

  fraud:
    build:
      context: ./services
      dockerfile: Dockerfile          # workspace build
      target: fraud-runner
    restart: always
    environment:
      DATABASE_URL: "postgresql://ecom:${DB_PASSWORD}@postgres:5432/ecom?sslmode=disable"
    networks: [app-net, db-net]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  recommendations:
    build:
      context: ./services
      dockerfile: Dockerfile          # workspace build
      target: recommendations-runner
    restart: always
    environment:
      DATABASE_URL: "postgresql://ecom:${DB_PASSWORD}@postgres:5432/ecom?sslmode=disable"
    networks: [app-net, db-net]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  auction:
    build:
      context: ./services
      dockerfile: Dockerfile          # workspace build
      target: auction-runner
    restart: always
    networks: [app-net]
    deploy:
      resources:
        limits:
          memory: 64M

  image-processor:
    build:
      context: ./services
      dockerfile: Dockerfile          # workspace build
      target: image-processor-runner
    restart: always
    environment:
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
    networks: [app-net]
    deploy:
      resources:
        limits:
          memory: 128M

  workers:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.workers
    restart: always
    environment:
      DATABASE_URL: "postgresql://ecom:${DB_PASSWORD}@postgres:5432/ecom?sslmode=disable"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SEARCH_SERVICE_URL: http://search:3001
      INVENTORY_SERVICE_URL: http://inventory:3002
      FRAUD_SERVICE_URL: http://fraud:3004
      RECOMMENDATIONS_SERVICE_URL: http://recommendations:3005
      IMAGE_PROCESSOR_SERVICE_URL: http://image-processor:3006
    networks: [app-net, db-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  event-consumer:
    build:
      context: .
      dockerfile: services/event-consumer/Dockerfile
    restart: always
    environment:
      DATABASE_URL: "postgresql://ecom:${DB_PASSWORD}@postgres:5432/ecom?sslmode=disable"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks: [app-net, db-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
