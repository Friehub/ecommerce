name: Deploy — Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true  # staging deploys can be superseded

jobs:
  deploy:
    name: Deploy Staging
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed for git diff change detection

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ecom/db generate

      # ── Automated Tests (Gate) ───────────────────────────────────────────
      # Rust services are disabled in staging — compiled via Node.js fallbacks.
      # Re-enable when Rust service compilation is added back to docker-compose.staging.yml.
      # - name: Set up Rust
      #   uses: dtolnay/rust-toolchain@stable
      # - name: Rust Cache
      #   uses: Swatinem/rust-cache@v2
      #   with:
      #     workspaces: services -> target
      # - name: Install Protoc
      #   run: ...
      # - name: Run Rust Tests
      #   working-directory: services
      #   run: cargo test --workspace

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Security Audit
        run: pnpm audit --audit-level critical

      - name: Validate Docker Build
        run: docker compose -f docker-compose.staging.yml build

      - name: Sync code
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='target' \
            --exclude='apps/web/.next/' \
            --exclude='nginx/certs/' \
            --exclude='.env*' \
            $GITHUB_WORKSPACE/ /opt/runner-work/jumia-staging/

      - name: Start database
        working-directory: /opt/runner-work/jumia-staging
        run: |
          docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --force-recreate postgres
          echo "Waiting for database to be ready..."
          sleep 10
          docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T postgres sh -c "psql -U ecom -d ecom -c 'GRANT ALL ON SCHEMA public TO ecom;'"
          docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T postgres sh -c "psql -U ecom -d ecom -c \"SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'ecom' AND pid <> pg_backend_pid();\"" || true
          docker compose -f docker-compose.staging.yml --env-file .env.staging stop api workers event-consumer || true

      - name: Migrate and seed staging database
        run: |
          DB_PASSWORD=$(grep '^DB_PASSWORD=' /opt/runner-work/jumia-staging/.env.staging | cut -d '=' -f2-)
          DATABASE_URL="postgresql://ecom:${DB_PASSWORD}@127.0.0.1:5433/ecom" pnpm --filter @ecom/db npx prisma db push --accept-data-loss --force-reset
          DATABASE_URL="postgresql://ecom:${DB_PASSWORD}@127.0.0.1:5433/ecom" pnpm --filter @ecom/db pnpm run seed

      # ── Detect what changed ────────────────────────────────────────────────
      - name: Detect changed service groups
        id: changes
        run: |
          RUST_CHANGED=false
          TS_CHANGED=false

          if git diff --name-only HEAD~1 HEAD | grep -qE '^(services/|docker-compose)'; then
            RUST_CHANGED=true
          fi
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(apps/|packages/|docker-compose)'; then
            TS_CHANGED=true
          fi

          echo "rust=$RUST_CHANGED" >> $GITHUB_OUTPUT
          echo "ts=$TS_CHANGED"     >> $GITHUB_OUTPUT
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "Rust changed: $RUST_CHANGED | TS changed: $TS_CHANGED"

      # ── Rust services disabled in staging (commented out of compose) ────────
      # - name: Build Rust services (workspace)
      #   if: steps.changes.outputs.rust == 'true'
      #   run: docker compose -f docker-compose.staging.yml --env-file .env.staging build \
      #     search inventory fraud recommendations auction image-processor

      # ── Build TypeScript services ──────────────────────────────────────────
      - name: Clear stale Docker build cache
        if: steps.changes.outputs.ts == 'true'
        run: docker builder prune -f --keep-storage 1GB

      - name: Build TypeScript services
        if: steps.changes.outputs.ts == 'true'
        working-directory: /opt/runner-work/jumia-staging
        env:
          DOCKER_BUILDKIT: 1
          IMAGE_TAG: ${{ steps.changes.outputs.tag }}
        run: |
          docker compose -f docker-compose.staging.yml --env-file .env.staging build \
            api workers event-consumer web

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Deploy staging
        working-directory: /opt/runner-work/jumia-staging
        env:
          IMAGE_TAG: ${{ steps.changes.outputs.tag }}
        run: |
          # Stop only the services that are about to be updated
          # Rust services (search, inventory, fraud, recommendations, auction, image-processor)
          # are disabled in docker-compose.staging.yml until compilation time is resolved.
          docker compose -f docker-compose.staging.yml --env-file .env.staging stop \
            nginx api workers event-consumer web || true

          docker compose -f docker-compose.staging.yml --env-file .env.staging \
            up -d \
            nginx api workers event-consumer web

          # Save the last successful tag for rollback
          echo "${{ steps.changes.outputs.tag }}" > last_success_staging_tag.txt

      # ── Smoke Test ───────────────────────────────────────────────────
      - name: Post-Deploy Smoke Test
        run: |
          echo "Verifying staging health..."
          sleep 10
          curl --fail --silent --show-error --max-time 10 http://localhost:4000/health || \
          (echo "Staging smoke test FAILED" && exit 1)
          echo "Staging verified!"

      # ── Bounded cache prune — keeps 15 GB, evicts oldest layers ──────────
      - name: Prune build cache (bounded)
        if: always()
        run: |
          docker builder prune --keep-storage 5GB -f
          docker image prune -a -f --filter "until=24h"

